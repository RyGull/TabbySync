name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the suite runs on node's built-in test
      # runner against the extension's own source.
      - name: Run tests
        run: npm test

      - name: Check manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - name: Check the generated server script is valid PHP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          node -e "
            globalThis.self = globalThis;
            globalThis.crypto = require('crypto').webcrypto;
            require('./shared/server-files.js');
            require('fs').writeFileSync('/tmp/tabbysync.php', self.TabbySyncServerFiles.phpFile('CI-TOKEN'));
          "
          php -l /tmp/tabbysync.php
