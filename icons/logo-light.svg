<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 40 880 280" width="100%" height="100%">
    <defs>
        <linearGradient id="gradDark" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1b3964;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2a5382;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#538cc4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2a5a8a;stop-opacity:1" />
        </linearGradient>
    </defs>

    <g transform="translate(130, 60)">
        <!-- Lock Shackle -->
        <path d="M 40 100 V 70 C 40 20, 120 20, 120 70 V 90" fill="none" stroke="url(#gradLight)" stroke-width="18" stroke-linecap="butt"/>
        <!-- Ribbon on Shackle Right -->
        <path d="M 111 40 L 160 40 L 145 53 L 160 65 L 111 65 Z" fill="url(#gradLight)"/>

        <!-- Top Arrow (S top half) -->
        <path d="M 20 140 C 20 70, 120 70, 140 110 L 160 100 L 165 140 L 125 135 L 135 120 C 115 95, 50 95, 50 140 C 50 160, 65 175, 80 185 L 65 205 C 35 185, 20 165, 20 140 Z" fill="url(#gradLight)"/>

        <!-- Bottom Arrow (S bottom half) -->
        <path d="M 140 170 C 140 240, 40 240, 20 200 L 0 210 L 5 170 L 45 175 L 35 190 C 55 215, 120 215, 120 170 C 120 150, 105 135, 90 125 L 105 105 C 135 125, 140 145, 140 170 Z" fill="url(#gradDark)"/>
    </g>

    <!-- Text -->
    <text x="350" y="235" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="100" fill="#1b3964">Sync<tspan font-weight="400">Locker</tspan></text>
    <text x="460" y="295" font-family="'Montserrat', Arial, sans-serif" font-weight="500" font-size="30" fill="#1b3964">Sync. Lock. Surf.</text>
</svg>
